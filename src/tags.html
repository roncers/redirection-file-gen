<div class="page">
    <main>
        <section aria-labelledby="page-title">
            <p class="eyebrow">Redirect file generator</p>
            <h1 id="page-title">One link<br>One small file</h1>
            <p class="intro">Have you never wanted to navigate from a file to an URL? ... no? Well, you should do it anyway. With this web is quite easy.</p>
        </section>
        <section class="card" aria-labelledby="form-title">
            <h2 id="form-title">Make your redirect</h2>
            <p class="card-copy">Add the destination URL and name your file.</p>
            <form novalidate>
                <label for="destination">Destination URL</label>
                <div class="field">
                    <div class="scheme">
                        <select id="scheme" aria-label="Protocol">
                            <option value="https" selected>https://</option>
                            <option value="http">http://</option>
                        </select>
                        <svg class="chevron" viewBox="0 0 10 6" aria-hidden="true">
                            <path d="M1 1l4 4 4-4" />
                        </svg>
                    </div>
                    <input id="destination" name="destination" type="text" inputmode="url" autocomplete="url"
                        placeholder="example.com/your-page" aria-describedby="url-hint error-message" required>
                </div>
                <p id="url-hint" class="hint">Add the address</p>
                <p id="error-message" class="error" role="alert" aria-live="polite"></p>

                <label for="filename" class="filename-label">File name</label>
                <div class="field filename">
                    <input id="filename" name="filename" type="text" value="output" autocomplete="off"
                        spellcheck="false" aria-describedby="filename-hint" required>
                    <span class="extension" aria-hidden="true">.html</span>
                </div>
                <p id="filename-hint" class="hint">Set the filename</p>

                <button class="download" type="submit" disabled>
                    Download <span id="file-label" class="file-label">output.html</span>
                    <span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em"
                            viewBox="0 0 24 24">
                            <title>arrow-down-from-line</title>
                            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"
                                stroke-width="2" d="M19 3H5m7 18V7m-6 8l6 6l6-6" />
                        </svg></span>
                </button>
            </form>
        </section>
    </main>
</div>
